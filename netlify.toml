# Netlify configuration for California Team Pickleball
# Static site deploy with form handling and pretty URLs

[build]
  publish = "."

# ---------- Pretty URLs ----------
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# ---------- Hub trailing slashes ----------
[[redirects]]
  from = "/leagues"
  to = "/leagues/"
  status = 301

[[redirects]]
  from = "/regions"
  to = "/regions/"
  status = 301

[[redirects]]
  from = "/news"
  to = "/news/"
  status = 301

# ---------- Headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
